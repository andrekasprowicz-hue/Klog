<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klo oder No-Go? – 30 Karten</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100vh;background:#f1f4fa;color:#172033;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}
main{width:100%;max-width:760px;background:white;border-radius:24px;padding:clamp(16px,4vw,32px);box-shadow:0 8px 32px #0001}
header,.stats,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(25px,5vw,36px);margin:0}.tag{background:#e8efff;color:#2853a6;border-radius:30px;padding:8px 12px;font-weight:bold}
.stats{margin:22px 0 8px;color:#64708a;font-weight:bold;font-size:14px}.track{height:9px;background:#e9edf5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#20a36b;width:0}
.card{margin-top:20px;border:2px solid #e8ecf4;border-radius:22px;padding:clamp(18px,5vw,36px);min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.prompt{font-size:13px;letter-spacing:1px;font-weight:bold;color:#78839a}.emoji{font-size:clamp(76px,18vw,120px);line-height:1.2}.item{font-size:clamp(30px,7vw,48px);margin:0}.hint{color:#78839a;margin:0}
.actions{width:100%;margin-top:10px}.actions button{width:50%;color:white}
button{border:0;border-radius:15px;padding:16px 20px;min-height:58px;font-size:18px;font-weight:bold;cursor:pointer;touch-action:manipulation;-webkit-appearance:none}
.no{background:#df4654;color:white}.yes{background:#159b68;color:white}.next,.again{background:#2859bd;color:white;width:100%;margin-top:8px}
.feedback{width:100%;background:#f1f4fa;border-radius:14px;padding:16px;text-align:left;line-height:1.5}.feedback strong{display:block;font-size:18px;margin-bottom:6px}
.end{display:none;text-align:center;padding:34px 8px}.score{font-size:56px;font-weight:900;color:#159b68}small{display:block;text-align:center;color:#8791a5;margin-top:14px}
@media(max-width:420px){header{align-items:flex-start}.tag{font-size:12px}.actions button{padding:12px 6px;font-size:16px}}
</style>
</head>
<body>
<main>
<header><h1>🚽 Klo oder No-Go?</h1><span class="tag">30 Karten</span></header>
<section id="game">
<div class="stats"><span id="progress">KARTE 1 VON 30</span><span id="points">0 Punkte</span></div>
<div class="track"><div class="bar" id="bar"></div></div>
<div class="card">
<div class="prompt">GEHÖRT DAS INS KLO?</div><div class="emoji" id="emoji">🧻</div><h2 class="item" id="item">Toilettenpapier</h2><p class="hint">Was meinst du?</p>
<div class="actions" id="actions">
<button class="no" id="noButton" type="button" onclick="answer(false)">✕ NEIN</button>
<button class="yes" id="yesButton" type="button" onclick="answer(true)">✓ JA</button>
</div>
<div class="feedback" id="feedback" style="display:none"></div>
<button class="next" id="nextButton" type="button" style="display:none" onclick="nextCard()">Nächste Karte →</button>
</div><small>Entscheide: Darf es in die Toilette gespült werden?</small>
</section>
<section class="end" id="end"><div style="font-size:64px">🏆</div><h2>Geschafft!</h2><div class="score" id="finalScore">0 / 30</div><h3 id="message"></h3><p>Du hast alle Karten gespielt.</p><button class="again" type="button" onclick="restart()">↻ Nochmal spielen</button></section>
</main>
<script>
var cards=[
["Toilettenpapier","🧻",true,"Toilettenpapier darf ins Klo. Es löst sich im Wasser auf."],
["Pipi","💧",true,"Urin gehört ganz normal ins Klo."],
["Kacka","💩",true,"Kot gehört ins Klo."],
["Feuchttücher","🧼",false,"Feuchttücher lösen sich nicht richtig auf und können Rohre verstopfen."],
["Bananenschale","🍌",false,"Essensreste gehören in den Biomüll."],
["Tampon","🩸",false,"Tampons gehören in den Mülleimer."],
["Wattestäbchen","🦻",false,"Wattestäbchen gehören in den Restmüll."],
["Windel","👶",false,"Windeln gehören in den Restmüll."],
["Klopapierrolle","🧻",false,"Die Papprolle gehört in den Papiermüll."],
["Taschentuch","🤧",false,"Benutzte Taschentücher gehören in den Restmüll."],
["Katzenstreu","🐈",false,"Katzenstreu gehört nicht in die Toilette. Es kann Rohre verstopfen."],
["Zahnbürste","🪥",false,"Eine alte Zahnbürste gehört in den Restmüll."],
["Speiseöl","🫗",false,"Speiseöl gehört nicht in den Abfluss. Es kann Rohre verstopfen."],
["Kaugummi","🍬",false,"Kaugummi gehört in den Restmüll."],
["Zahnseide","🦷",false,"Zahnseide gehört in den Restmüll."],
["Küchenpapier","🧻",false,"Küchenpapier löst sich nicht so auf wie Toilettenpapier. Es gehört in den Restmüll."],
["Essensreste","🍝",false,"Essensreste gehören in den Biomüll, nicht in die Toilette."],
["Kaffeesatz","☕",false,"Kaffeesatz gehört in den Biomüll."],
["Eierschalen","🥚",false,"Eierschalen gehören in den Biomüll."],
["Zigarettenkippe","🚬",false,"Zigarettenkippen gehören in den Restmüll."],
["Pflaster","🩹",false,"Pflaster gehören in den Restmüll."],
["Verband","🩼",false,"Benutzte Verbände gehören in den Restmüll."],
["Kondom","🛡️",false,"Kondome gehören in den Restmüll."],
["Haare","💇",false,"Haare gehören in den Restmüll."],
["Spielzeugauto","🚗",false,"Spielzeug gehört nicht in die Toilette."],
["Lego-Stein","🧱",false,"Lego-Steine können Rohre verstopfen. Sie gehören nicht ins Klo."],
["Socke","🧦",false,"Kleidung gehört nicht in die Toilette."],
["Binden","🩸",false,"Binden gehören in den Mülleimer."],
["Medikamente","💊",false,"Medikamente gehören niemals in die Toilette. Frage eine erwachsene Person nach der richtigen Entsorgung."],
["Farbreste","🎨",false,"Farbreste gehören nicht in die Toilette. Frage eine erwachsene Person nach der richtigen Entsorgung."],
["Milchreste","🥛",false,"Milchreste gehören nicht in die Toilette. Entsorge sie nach den örtlichen Hinweisen."]
];
var deck=[],position=0,points=0,answered=false;
function byId(id){return document.getElementById(id)}
function shuffle(list){var a=list.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function showCard(){
 var c=cards[deck[position]];
 byId("progress").textContent="KARTE "+(position+1)+" VON 30";
 byId("points").textContent=points+" Punkte";
 byId("bar").style.width=((position+1)/30*100)+"%";
 byId("emoji").textContent=c[1];byId("item").textContent=c[0];
 byId("actions").style.display="flex";byId("feedback").style.display="none";byId("nextButton").style.display="none";
 byId("nextButton").textContent=position===29?"Ergebnis anzeigen":"Nächste Karte →";
 // Buttons bleiben echte HTML-Buttons; nur ihre Reihenfolge wird vertauscht.
 var order=shuffle(["noButton","yesButton"]);
 byId("actions").appendChild(byId(order[0]));byId("actions").appendChild(byId(order[1]));
 answered=false;
}
function answer(choice){
 if(answered)return;
 answered=true;
 var c=cards[deck[position]],correct=(choice===c[2]);
 if(correct)points++;
 byId("points").textContent=points+" Punkte";
 byId("actions").style.display="none";
 byId("feedback").innerHTML="<strong>"+(correct?"✅ Richtig!":"❌ Leider falsch!")+"</strong>"+c[3];
 byId("feedback").style.display="block";byId("nextButton").style.display="block";
}
function nextCard(){
 if(position<29){position++;showCard();return;}
 byId("game").style.display="none";byId("end").style.display="block";
 byId("finalScore").textContent=points+" / 30";
 byId("message").textContent=points>=26?"Du bist ein Klo-Profi!":points>=20?"Sehr gut gemacht!":"Weiter üben – du schaffst das!";
}
function restart(){deck=shuffle(cards.map(function(c,i){return i;}));position=0;points=0;byId("end").style.display="none";byId("game").style.display="block";showCard();}
restart();
</script>
</body></html>
